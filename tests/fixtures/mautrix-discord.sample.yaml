homeserver:
  address: http://localhost:8008
  domain: localhost
  software: standard

appservice:
  address: http://127.0.0.1:29334
  hostname: 127.0.0.1
  port: 29334
  id: discord
  ephemeral_events: true
  async_transactions: false
  as_token: discord-as-token
  hs_token: discord-hs-token
  database:
    type: sqlite3-fk-wal
    uri: file:tests/fixtures/mautrix-discord.db?_txlock=immediate
    max_open_conns: 20
    max_idle_conns: 2
  bot:
    username: discordbot
    displayname: Discord Bridge
    avatar: ""

bridge:
  username_template: discord_{{.}}
  displayname_template: "{{if .Webhook}}Webhook{{else}}{{or .GlobalName .Username}}{{if .Bot}} (bot){{end}}{{end}}"
  channel_name_template: "{{if or (eq .Type 3) (eq .Type 4)}}{{.Name}}{{else}}#{{.Name}}{{end}}"
  guild_name_template: "{{.Name}}"
  private_chat_portal_meta: always
  startup_private_channel_create_limit: 200
  portal_message_buffer: 128
  public_address: ""
  avatar_proxy_key: ""
  delivery_receipts: true
  message_status_events: false
  message_error_notices: true
  restricted_rooms: true
  autojoin_thread_on_open: true
  embed_fields_as_tables: true
  mute_channels_on_create: false
  sync_direct_chat_list: false
  resend_bridge_info: false
  custom_emoji_reactions: true
  delete_portal_on_channel_delete: false
  delete_guild_on_leave: true
  federate_rooms: true
  prefix_webhook_messages: true
  enable_webhook_avatars: false
  use_discord_cdn_upload: true
  proxy: ""
  cache_media: unencrypted
  command_prefix: "!discord"
  direct_media:
    enabled: true
    server_name: discord-media.example.com
    well_known_response: https://discord-media.example.com
    allow_proxy: true
    server_key: sample-direct-media-key
  animated_sticker:
    target: webp
    args:
      width: 320
      height: 320
      fps: 25
  backfill:
    forward_limits:
      initial:
        dm: 200
        channel: 0
        thread: 0
      missed:
        dm: -1
        channel: 0
        thread: 0
    max_guild_members: -1
  provisioning:
    prefix: /_matrix/provision
    shared_secret: disable
    debug_endpoints: false
  permissions:
    "*": relay
    localhost: admin
    "@admin:localhost": admin

logging:
  print_level: debug
